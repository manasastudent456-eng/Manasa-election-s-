<!DOCTYPE html><html><head><title>Booking & Payment</title><style>body{font-family:Arial;background:#f4f6fb;padding:30px}.box{background:white;padding:25px;max-width:550px;margin:auto;border-radius:15px}input,button{width:100%;padding:12px;margin:8px 0}button{background:#6c3cff;color:white;border:0;border-radius:8px}.result{background:#eee9ff;padding:15px}</style></head><body><div class="box"><h1>💳 Booking & Payment</h1><h3 id="product"></h3><input id="start" type="date"><input id="end" type="date"><button onclick="calculate()">Calculate</button><div id="result" class="result"></div><button onclick="book()">Confirm Booking & Payment</button><a href="index.html">← Home</a></div><script>let product=localStorage.getItem('selectedProduct')||'No product selected';document.getElementById('product').textContent=product;let prices={Laptop:499,Camera:799,Projector:599,'Gaming Console':699,Speaker:299,Tablet:399};let total=0;function calculate(){let a=new Date(start.value),b=new Date(end.value),d=Math.ceil((b-a)/86400000);if(!start.value||!end.value||d<1)return alert('Select valid dates');total=d*prices[product];result.innerHTML=`${d} day(s) × ₹${prices[product]} = <b>₹${total}</b><br>Security deposit: ₹2,000`}function book(){if(!total)return alert('Calculate first');let b=JSON.parse(localStorage.getItem('bookings')||'[]');b.push({product,start:start.value,end:end.value,total,status:'Booked'});localStorage.setItem('bookings',JSON.stringify(b));alert('Booking confirmed. Demo payment successful!')}</script></body></html>
